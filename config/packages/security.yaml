security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        #Ce bloc indique à Symfony comment les mots de passe des utilisateurs doivent être chiffrés (hachés)
        # 'auto' signifie que Symfony choisit automatiquement un algorithme de hachage adapté.


    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers: #Où dois-je chercher les utilisateurs ?
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider: #va chercher dans la table user, la ligne où email = celui-tapé
            entity:
                class: App\Entity\User #signifie que Symfony utilise cette entité.
                property: email #Cela signifie que Symfony identifie l'utilisateur grâce à son adresse e-mail.

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false 
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker 
            #permet de réaliser des vérifications supplémentaires sur l'utilisateur lors de l'authentification
            form_login: 
            #indique que ton application utilise un formulaire de connexion classique
                login_path: app_login 
                #indique la route qui affiche le formulaire de connexion
                check_path: app_login 
                #C'est également la route utilisée pour traiter les informations envoyées par le formulaire de connexion.
                default_target_path: app_home 
                #ediriger l'utilisateur vers app_home Après une connexion réussie
                enable_csrf: true 
                #Symfony protège ton formulaire de connexion avec un token CSRF.
            logout: 
            #Ce bloc configure la déconnexion.
                path: app_logout 
                #Cela indique la route utilisée pour demander une déconnexion.
                target: app_home 
                #Après la déconnexion, Symfony redirige l'utilisateur vers app_home

                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
         - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
