vich_uploader:
    db_driver: orm
    mappings: #Voici comment je veux gérer un type de fichier
        product_images:
            uri_prefix: /uploads/products #permet à Symfony/Twig de construire l'URL :
            upload_destination: '%kernel.project_dir%/public/uploads/products' #où le fichier doit être enregistré physiquement par vich uploader.
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer #Lorsque tu enregistres une image, génère automatiquement un nom unique et sécurisé.